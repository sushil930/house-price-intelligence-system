  <text x="1580" y="326" font-size="12" font-weight="700" fill="#065F46">Charts · PNG</text>
  <text class="mono" x="1580" y="345" font-size="9" fill="#4B5563">dashboards · pairplot</text>
  <text class="mono" x="1580" y="358.5" font-size="9" fill="#4B5563">facetgrid · residuals</text>
  <line x1="1552" y1="374" x2="1694" y2="374" stroke="#D1FAE5" stroke-width="1"/>

  <g transform="translate(1552,388) scale(0.8)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 4C7.8 4 7 4.9 7 6.5v2.3C7 10 6.3 10.9 5 11.4c1.3.5 2 1.4 2 2.6v3.5C7 19.1 7.8 20 9.5 20"/>
