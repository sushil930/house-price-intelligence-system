  <text x="1270" y="290" font-size="15" font-weight="700" fill="#0F172A">Model</text>
  <text x="1270" y="322" font-size="10" fill="#64748B">regression · VIF · KMeans</text>
  <rect x="1270" y="336" width="59" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text class="mono" x="1278" y="349.5" font-size="9" fill="#475569">modeling</text>

